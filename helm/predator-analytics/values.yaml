# PREDATOR Analytics Helm Values
# Override values in environment-specific values files (values.staging.yaml, values.prod.yaml)

replicaCount: 2

image:
  repository: ghcr.io/dima1203oleg/dev6
  pullPolicy: Always
  # Overridden by CI/CD with specific SHA
  tag: "latest"

nameOverride: ""
fullnameOverride: "predator-analytics"

serviceAccount:
  create: true
  name: "predator-analytics"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: predator.analytics.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: predator-analytics-tls
      hosts:
        - predator.analytics.example.com

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "1Gi"
    cpu: "1000m"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

probes:
  liveness:
    path: /live
    initialDelaySeconds: 30
    periodSeconds: 30
  readiness:
    path: /ready
    initialDelaySeconds: 15
    periodSeconds: 10
  startup:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 12

env:
  NODE_ENV: production
  PORT: "3000"
  HOST: "0.0.0.0"

# Secrets (injected from external secrets or Vault — NOT stored in values files)
secrets:
  existingDbSecret: "predator-db-secret"
  existingApiKeysSecret: "predator-api-keys"

postgresql:
  enabled: false
  # Use external managed PostgreSQL in production

redis:
  enabled: false
  # Use external managed Redis in production

networkPolicy:
  enabled: true

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
