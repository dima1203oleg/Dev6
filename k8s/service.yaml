apiVersion: v1
kind: Service
metadata:
  name: predator-analytics
  namespace: predator-analytics
  labels:
    app: predator-analytics
    app.kubernetes.io/name: predator-analytics
spec:
  type: ClusterIP
  selector:
    app: predator-analytics
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: predator-analytics
  namespace: predator-analytics
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - predator.analytics.example.com
      secretName: predator-analytics-tls
  rules:
    - host: predator.analytics.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: predator-analytics
                port:
                  number: 80
