apiVersion: v1
kind: ServiceAccount
metadata:
  name: predator-analytics
  namespace: predator-analytics
  labels:
    app: predator-analytics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: predator-analytics
  namespace: predator-analytics
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: predator-analytics
  namespace: predator-analytics
subjects:
  - kind: ServiceAccount
    name: predator-analytics
    namespace: predator-analytics
roleRef:
  kind: Role
  name: predator-analytics
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: predator-analytics
  namespace: predator-analytics
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: predator-analytics
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: predator-analytics
  namespace: predator-analytics
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: predator-analytics
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: predator-analytics
  namespace: predator-analytics
spec:
  podSelector:
    matchLabels:
      app: predator-analytics
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 443   # External HTTPS
        - protocol: TCP
          port: 80    # External HTTP
        - protocol: TCP
          port: 53    # DNS
        - protocol: UDP
          port: 53    # DNS
