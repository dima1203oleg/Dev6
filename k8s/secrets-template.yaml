apiVersion: v1
kind: Secret
metadata:
  name: predator-db-secret
  namespace: predator-analytics
type: Opaque
# DO NOT store real secrets here. Use Sealed Secrets or external secrets operator.
# These are placeholders only — override via Helm values or Vault injection.
stringData:
  host: "predator-postgres.predator-analytics.svc.cluster.local"
  port: "5432"
  name: "predator"
  user: "predator"
  password: "REPLACE_WITH_REAL_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: predator-api-keys
  namespace: predator-analytics
type: Opaque
# DO NOT store real keys here. Inject via Vault or Sealed Secrets.
stringData:
  gemini-api-key: "REPLACE_WITH_REAL_KEY"
  auth-tokens: "REPLACE_WITH_REAL_TOKENS"
