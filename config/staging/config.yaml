# Staging Environment Configuration
# Environment: Staging
# Purpose: Pre-production testing

environment:
  name: staging
  mode: production

server:
  port: 3000
  host: 0.0.0.0
  cors:
    origin: "https://staging.predator.gov.ua"
    credentials: true

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: predator_staging
  user: ${DB_USER}
  ssl: true
  pool:
    min: 5
    max: 20

connectors:
  production_mode: true
  certified_only: true
  allow_unofficial: false
  timeout_ms: 15000
  concurrency: 8

authentication:
  required: true
  default_role: null

rate_limiting:
  enabled: true
  default:
    max_requests: 200
    window_ms: 60000
  search:
    max_requests: 100
    window_ms: 60000
  probe:
    max_requests: 40
    window_ms: 60000
  admin:
    max_requests: 60
    window_ms: 60000
  ai:
    max_requests: 20
    window_ms: 60000

logging:
  level: info
  structured: true
  console: false

observability:
  metrics_enabled: true
  tracing_enabled: true
  health_checks_enabled: true

features:
  ai_enabled: true
  media_enabled: true
  video_enabled: true
  music_enabled: true
