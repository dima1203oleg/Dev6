# Production Environment Configuration
# Environment: Production
# Purpose: Live production deployment

environment:
  name: production
  mode: production

server:
  port: ${PORT}
  host: 0.0.0.0
  cors:
    origin: "https://predator.gov.ua"
    credentials: true

database:
  host: ${DB_HOST}
  port: ${DB_PORT}
  name: ${DB_NAME}
  user: ${DB_USER}
  ssl: true
  pool:
    min: 10
    max: 50

connectors:
  production_mode: true
  certified_only: true
  allow_unofficial: false
  certified_sources:
    - hibp
    - crt_sh
  timeout_ms: 15000
  concurrency: 8

authentication:
  required: true
  default_role: null

rate_limiting:
  enabled: true
  default:
    max_requests: 100
    window_ms: 60000
  search:
    max_requests: 50
    window_ms: 60000
  probe:
    max_requests: 20
    window_ms: 60000
  admin:
    max_requests: 30
    window_ms: 60000
  ai:
    max_requests: 10
    window_ms: 60000

logging:
  level: warn
  structured: true
  console: false

observability:
  metrics_enabled: true
  tracing_enabled: true
  health_checks_enabled: true
  alerts_enabled: true

features:
  ai_enabled: true
  media_enabled: true
  video_enabled: true
  music_enabled: true

security:
  secrets_vault: true
  audit_logging: true
  csrf_protection: true
  input_validation: true
